name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
      - if: matrix.node == 24
        run: npm run test:package

  pi-sdk-compatibility:
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.sdk == 'latest'
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest
      - run: npm run typecheck
      - run: npm test
